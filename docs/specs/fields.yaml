# OpenSpec — Data Dictionary (UI input fields + DB mapping)
# Compact form of: "Description UI Input Fields DigiONS - Retro-Fit.md",
# "UI full view (DigiONS detailled information).md", "New DB structure for telecontroldevice table.md".
# Cols: field = DE/EN name | db = DB field / mapping | mand = mandatory | vis | edit | notes

abstract_station_number:
  db: stationNumber
  format: "<DSO>-<jj>_<0001>_digiONS"      # unique, auto-generated by Ivy; e.g. WNS-23_1001_digiONS
  DSO_by_connection_target_MSP: {Leitsystem: WES, Leitsystem_Nord: WNN, Leitsystem_Sued: WNS, legacy: WEN}
  jj: "year (22,23,24)"
  seq: "0001+ increasing per year"

digions_type:
  db: digionsTypeId (ValueListItem)
  DigiONS_values:  [FS, NS]                 # domain DIGIONS_TYPE        -> process path 8a
  RetroFit_values: [LM, LO, SM, SO]         # domain DIGIONS_TYPE_RETRO_FIT -> process path 8b
  note: "KFWG Type set to RetroFit automatically when supplier returns SM/SO/LM/LO in connection test."

kfwg_type:
  db: smallTelecontrolDeviceType
  values: [digiONS(default), RetroFit, "Westnetz-Gateway 1.0/2.0/Light", NMS, WBR, WS, PK, NB4.0]

ms_switchgear_config:  # MS-Schaltanlagen-Konfiguration
  db: midVoltageSwitchConfigId (ValueListItem, domain MID_VOLTAGE_SWITCH_CONFIG)
  values: [KKT, KKKT, KT, KKKKT, KKTT, KKKTT, KKK, KKKK, KKKKK]
  supplier_rule: "<=3 letters -> WAGO ; >=4 letters -> SPRECHER (out of scope atm)"
  note: "value 'KuRi' also routes device into retrofit stocklist (step 8b)."

kuri:  # Kurzschlussanzeiger / KuRi (short-circuit indicator)
  retrofit_checkbox: "Kommunikationsfaehige KuRi vorhanden / KuRi with communication available (optional)"
  response_value: {db: responseValue, de: "Ansprechwert Kurzschlussanzeiger"}
  gate: "step 15 needs >=1 KuRi checkbox set."

ns_low_voltage:  # NS / Niederspannung
  ns_measurement:        {db: lowVoltageMeasurementId, domain: LOW_VOLTAGE_MEASUREMENT, values: ["NS(n)"]}
  ns_trafomessung:       "NS Trafomessung vorhanden / NS transformer measurement available (retrofit, MANDATORY)"
  ns_abgangsmessung:     "NS Abgangsmessung vorhanden / NS outlet measurement available (retrofit, optional)"
  metering_strips_count: {db: lowVoltageMeteringStrips, de: "Anzahl Niederspannungsmessleisten", mand_if: "manufacturer not null"}
  metering_manufacturer: {db: lowVoltageMeteringManufacturerId, domain: MANUFACTURER_LOW_VOLTAGE_METERING, values: [Manufacturer A, Manufacturer B, Manufacturer C]}

technical_place:  # TP / Technischer Platz
  db: "station.technicalPlace / technicalPlaceManual"
  old: {db: "(old technical place)", note: "set via EAM migration KFWT-713"}
  select: "choose station via technical place (POST station upload); FK stationId set unless stationNotFound"
  eam_structure: [TP-HN00, DZ_S_ROU, DE_E_BAT, DE_E_UEE, "TP-HN00-SE01", DZ_A_SLT, DZ_S_SE]  # WNGW omits DE_E_BAT/DE_E_UEE

vnb_dso:  # Verteilnetzbetreiber / Distribution system operator
  db: distributionSystemOperator
  mandatory: yes
  source: "value list maintained in area administration -> distribution system operator"
  relation: "DSO abbreviation drives abstract_station_number prefix (see abstract_station_number)."

ront:            {db: rontId, domain: RONT, values: [rONT]}
net_shape:       {db: netShape, de: Netzform, values: [ISOLIERT, INDUKTIV, NIEDEROHMIGGEERDET]}
asset_status:    {db: assetStatus, de: Anlagenstatus, values: [STATIONSNEUBAU, VORHANDENESTATION]}
ownership:       {db: property, de: Eigentum, values: [WESTNETZ, KUNDE, STADTWERKE]}
destination:     {db: destination, de: DigiONS Zielort, values: ["DigiONS Auslieferung (Deliver DigiONS)", "DigiONS auf Lager (DigiONS in stock)"]}
sap_order:       {db: sapOrder, de: SAP Auftragsnummer}
triggering_rc:   {db: triggerRegionalCenterId, de: "Ausloesendes RZ (dropdown of ST-Areas)"}
installation_rc: {db: installationRegionalCenter, de: "RZ der Installation"}
st_area:         {db: stAreaId, de: ST-Bereich}

# UI panels (fieldsets) grouping — used by visibility matrix in roles.yaml:
panels:
  - Uebergabestation (Transfer station)
  - Fernwirkanbindung - Allgemeine Informationen (Telecontrol connection - General)
  - Fernwirkanbindung - Leitsystem (Control system)
  - DigiONS - Allgemeine Informationen
  - DigiONS - Detailinformationen
  - Nachrichtentechnik (Communications Engineering)
  - Routerinformationen (Router information)
  - Detailinformationen - Stromversorgung (Power supply)
  - Lieferanschrift (Delivery address)

db_tables:
  telecontrolDevice: "general fields (all types)"
  telecontrolDevice_digions: "digiONS-specific fields"
  telecontrolDevice_wngw: "Westnetz-Gateway-specific fields"

retrofit_naming_convention:  # from 'DigiONS - Retro-Fit Process.md' (SAP order sticker)
  pattern: "<DSO>-<Jahr.laufendeNr>-digiONS-<Typ>-<KuRi|leer>"
  example: "WNS- 23.1001- digiONS- LO- KuRi"
  parts: {1: DSO, 2: "Jahr.laufende Nr", 3: digiONS, 4: "LM|LO|SM|SO", 5: "KuRi oder leer"}
