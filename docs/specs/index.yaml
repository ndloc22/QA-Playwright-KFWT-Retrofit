  roles.yaml:   Role Concept, regions/ST-Areas, per-fieldset visible/editable matrix.
  fields.yaml:  Data dictionary — station-number format, DSO, digiONS-Type, KuRi, NS, TP, VNB, status enum.
key_codes:
  digions_type_DigiONS: [FS, NS]            # -> path 8a (Source-Sink-Test)
  digions_type_RetroFit: [LM, LO, SM, SO]   # -> path 8b (Push to stocklist)
  station_number_format: "<DSO>-<jj>_<0001>_digiONS"   # e.g. WNS-23_1001_digiONS
